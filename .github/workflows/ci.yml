name: Windows CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.95.0-x86_64-pc-windows-msvc
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: pwsh

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Verify embedded asset hashes
        run: python scripts/verify-assets.py
      - name: Fetch locked Windows dependencies
        run: cargo fetch --locked --target x86_64-pc-windows-msvc
      - name: Verify dependency notices
        run: python scripts/generate-notices.py --check
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Build and package Windows x64
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: .\scripts\build-windows.ps1 -Tag $env:RELEASE_TAG
      - name: Retain release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reeb-windows-x64
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            dist/reeb.exe
            dist/reeb-windows-x64.zip
            dist/reeb-notices.zip
            dist/LICENSE
            dist/SHA256SUMS

  advisories:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --no-self-update
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Dependency advisory gate
        run: cargo audit --file Cargo.lock --target-os windows --target-arch x86_64 --deny unsound
