[package]
name = "reeb"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Mechanical keyboard sounds for Windows and macOS"
license = "MIT"
publish = false

[dependencies]
cpal = "=0.16.0"
crossbeam-queue = "0.3.12"
eframe = { version = "=0.33.0", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
hound = "3.5.1"
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
